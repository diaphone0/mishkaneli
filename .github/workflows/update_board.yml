name: Update Prayer Times Board

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy to GitHub Pages even if content did not change"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    paths:
      - "combine_prayer_times.py"
      - "fetch_prayer_times.py"
      - "config.py"
      - "config.json"
      - ".github/workflows/update_board.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "update-prayer-board"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.render.outputs.deploy }}
    steps:
      - name: Checkout mishkaneli repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout shul-luah libraries (pyzmanim + tagging)
        uses: actions/checkout@v4
        with:
          repository: diaphone0/shul-luah
          path: shul-luah

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "site/requirements.txt"

      - name: Install dependencies
        run: python -m pip install -r site/requirements.txt

      - name: Render unified HTML and compare against live site
        id: render
        env:
          MYGABAY_SEPHARDI_URL: ${{ secrets.MYGABAY_SEPHARDI_URL }}
          MYGABAY_ASHKENAZI_URL: ${{ secrets.MYGABAY_ASHKENAZI_URL }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          mkdir -p _public

          if [ "$FORCE_DEPLOY" != "true" ]; then
            if curl -fsSL --retry 2 --max-time 15 https://mishkaneli.org/ -o _public/index.html; then
              before_hash="$(sha256sum _public/index.html | awk '{print $1}')"
            else
              rm -f _public/index.html
              before_hash=""
            fi

            python site/combine_prayer_times.py \
              --config site/config.json \
              --luah-suite-path "$GITHUB_WORKSPACE/shul-luah" \
              --only-combined-html \
              --skip-if-unchanged \
              --html-out _public/index.html

            after_hash="$(sha256sum _public/index.html | awk '{print $1}')"
            if [ "$before_hash" != "$after_hash" ]; then
              echo "Content changed — deploying updated index.html to GitHub Pages."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "No content changes outside footer — skipping deployment."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Force deploy requested — rendering and deploying unconditionally."
            python site/combine_prayer_times.py \
              --config site/config.json \
              --luah-suite-path "$GITHUB_WORKSPACE/shul-luah" \
              --only-combined-html \
              --html-out _public/index.html
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add CNAME to Pages bundle
        if: steps.render.outputs.deploy == 'true'
        run: |
          if [ -f site/CNAME ]; then
            cp site/CNAME _public/CNAME
          fi

      - name: Upload GitHub Pages artifact
        if: steps.render.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
